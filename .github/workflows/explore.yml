name: Explore
on:
  push:
    branches: [scratch-atlas]
permissions: {}
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          B="https://atlas.ripe.net/api/v2/measurements/"
          for t in ping sslcert http traceroute dns; do
            echo "== asn8075 $t"
            curl -s -m 30 "$B?status=2&is_public=true&target_asn=8075&type=$t&page_size=100" | jq -c '.count as $c | [.results[] | {id,target,interval,p:.participant_count,af,st:.start_time}] | sort_by(-.p) | {c:$c, top:.[0:12]}'
          done
          for h in outlook.office365.com login.microsoftonline.com graph.microsoft.com teams.microsoft.com www.office.com portal.azure.com; do
            echo "== target $h"
            curl -s -m 30 "$B?status=2&is_public=true&target=$h&page_size=100" | jq -c '.count as $c | [.results[] | {id,type,interval,p:.participant_count,af}] | sort_by(-.p) | {c:$c, top:.[0:6]}'
          done

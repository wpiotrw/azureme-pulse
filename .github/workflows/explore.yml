name: Explore
on:
  push:
    branches: [scratch-atlas]
permissions: {}
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          B="https://atlas.ripe.net/api/v2/measurements/"
          echo "== raw1"; curl -s -m 25 "$B?status=2&type=ping&target__contains=office365&page_size=3" | head -c 700; echo
          echo "== raw2"; curl -s -m 25 "$B?status=2&type=ping&target=outlook.office365.com&page_size=3" | head -c 700; echo
          echo "== raw3"; curl -s -m 25 "$B?status=2&search=office365&page_size=3" | head -c 700; echo
          echo "== raw4"; curl -s -m 25 "$B?status=2&description__contains=office365&page_size=3" | head -c 500; echo
          echo "== asn"; curl -s -m 25 "$B?status=2&target_asn=8075&type=ping&page_size=3" | head -c 900; echo
          echo "== asn-http"; curl -s -m 25 "$B?status=2&target_asn=8075&type=http&page_size=3" | head -c 500; echo
